<!doctype html>

<head>
<meta charset="utf-8">

<title>BLAME.GG — разбор матча Dota 2</title>

<meta property="og:title" content="BLAME.GG — кто слил катку?">
<meta property="og:description" content="Разбор матча Dota 2: руинер, момент слива, дуэли и прожарка. Вставь Match ID — узнай, кто виноват.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#07080c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307080c'/%3E%3Ctext x='32' y='44' font-size='36' font-family='Arial' font-weight='900' fill='%23ff4d5e' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<header class="top">
  <a class="logo" href="./">BLAME<span>.GG</span></a>
  <nav class="topnav">
    <button id="partyBtn" class="ghost small" type="button">Пати</button>
    <button id="meBtn" class="ghost small" type="button">Мой аккаунт</button>
    <button id="plusBtn" class="plusBtn small" type="button">BLAME+</button>
  </nav>
</header>

<main>
  <section id="hero" class="hero">
    <div class="eyebrow">DOTA 2 · РАЗБОР МАТЧА</div>
    <h1>Кто <em>слил</em> катку?</h1>
    <p class="lead">Вставь Match ID или найди себя по нику. Покажем, кто сильнее всех потянул команду вниз, на чём именно, и что исправить в следующей игре.</p>
    <form id="searchForm" class="search" autocomplete="off">
      <div class="seg" role="tablist" aria-label="Режим поиска">
        <button type="button" data-mode="match" class="on" role="tab">Матч</button>
        <button type="button" data-mode="player" role="tab">Игрок</button>
      </div>
      <input id="q" inputmode="text" placeholder="Match ID или ссылка на матч">
      <button class="primary" type="submit">Разобрать</button>
    </form>
    <div id="status" class="status" aria-live="polite"></div>
    <div id="picker"></div>
    <div id="history"></div>
  </section>

  <section id="app" class="hidden"></section>
</main>

<footer><span>Данные: OpenDota API. Индекс вины — оценка модели, а не приговор: всегда смотри контекст.</span>
